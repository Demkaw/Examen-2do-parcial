<!DOCTYPE html>
<html lang="es" class="has-navbar-fixed-top">
    <head>
        <meta charset="UTF-8">
        <title>Alice's Arsenal y Mis personajes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <link rel="stylesheet" href="css/style.css">
  
    </head>
                <div class="column has-text-right mt-auto">
                    <h1 class="title" style="letter-spacing: 1px;">Alice's Arsenal Registry</h1>
                     <a class="subtitle has-text-weight-bold has-text-danger" href="https://www.youtube.com/watch?v=abI8fTvpN1U" style="text-decoration: underline;">Para conocer mas de la jugabilidad</a>
                    <p class="subtitle">El repertorio de armas y artefactos del País de las Maravillas (y algunos personajes mios)</p>
            </div>
        </nav>
        
        <div class="columns is-mobile mt-6 pt-5">
            <div class="column is-two-thirds-desktop is-half-mobile ml-6">
                <div class="card p-4" style="background-color: #121212; border: 1px solid #2a2a2a;">
                    <div class="grid" id="Grid">
                        <!-- Las tarjetas se generan dinámicamente aquí -->
                        <div class="card cell p-auto" style="min-height: 606px; background-color: #080808; border: 1px dashed #440000;">
                            <div class="card-image is-flex is-justify-content-center is-align-items-center" style="min-height: 100%;">
                               
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="column" style="position: fixed; top: 12.5rem; right: 10px; width: 30%;">
                <div class="card mr-5" id="searchBox" style="background-color: #121212; border: 1px solid #2a2a2a;">
                    <div class="card-content">
                        <input class="input is-rounded" type="text" placeholder="Buscar en el registro..." id="searchInput" style="background-color: #1a1a1a; color: #fff; border: 1px solid #440000;"/>
                    </div>
                    <footer class="card-footer p-4" style="border-top: 1px solid #2a2a2a;">
                        <a class="card-footer-item icon my-auto" id="saveCatalog" style="color: #fff;"><figure class="image mr-2 invert"><img src ="Guardar" style="width: 24px;"></figure>Guardar</a>
                        <a class="card-footer-item icon my-auto" id="loadCatalog" style="color: #fff;"><figure class><img src ="Cargar" style="width: 24px;"></figure>Cargar</a>
                        <a class="card-footer-item icon my-auto" id="resetCatalog" style="color: #fff;"><figure class=><img src ="Restablecer" style="width: 24px;"></figure>Reset</a>
                    </footer>
                </div>
                
                <div class="card p-5 mt-3 mr-5" id="descriptionBox" style="height: 600px; background-color: #121212; border: 1px solid #2a2a2a; overflow-y: auto;">
                    <p class="title has-text-centered text-white" style="font-size: 1.5rem;">Expediente de Armas</p>
                    <p class="subtitle has-text-centered">Selecciona un elemento para ver su información detallada.</p>
                </div>
            </div>
        </div>
        <script src="js/main.js"></script>
    </body>
</html>
